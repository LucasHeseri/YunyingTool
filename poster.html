<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能出行海报编辑器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    padding: 40px 20px;
  }

  .hint {
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  /* ========== 海报容器 ========== */
  .poster {
    position: relative;
    width: 100%;
    max-width: 1400px;
    aspect-ratio: 21 / 9;
    overflow: hidden;
    background: #000;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  /* ========== Layer 1: 背景图 ========== */
  .poster-bg {
    position: absolute;
    inset: 0;
    background: url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=2800&auto=format&fit=crop') center/cover no-repeat;
  }

  /* ========== Layer 2: 暗色遮罩 ========== */
  .poster-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      90deg,
      rgba(0,0,0,0.75) 0%,
      rgba(0,0,0,0.45) 40%,
      rgba(0,0,0,0.1) 70%,
      rgba(0,0,0,0.3) 100%
    );
    pointer-events: none;
  }

  /* ========== Layer 3: 底部环境光遮罩 ========== */
  .poster-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at 50% 100%,
      rgba(0,0,0,0.4) 0%,
      transparent 60%
    );
    pointer-events: none;
  }

  /* ========== Layer 4 & 5: 文字内容层 ========== */
  .poster-content {
    position: absolute;
    inset: 0;
    padding: 5% 6%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 1fr auto;
    color: #fff;
    z-index: 10;
  }

  /* 可编辑文字通用样式 */
  [contenteditable="true"] {
    outline: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s, background 0.2s;
    cursor: text;
  }
  [contenteditable="true"]:hover {
    border-bottom: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.05);
  }
  [contenteditable="true"]:focus {
    border-bottom: 1px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.08);
  }

  /* ---------- 右上 Logo ---------- */
  .logo-area {
    grid-row: 1;
    grid-column: 2;
    justify-self: end;
    text-align: right;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .logo-icon {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1;
  }
  .logo-text {
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.9;
    margin-top: 2px;
  }

  /* ---------- 左上主标题区 ---------- */
  .main-title-area {
    grid-row: 2;
    grid-column: 1;
    align-self: start;
    margin-top: 2%;
  }
  .subtitle-en {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(12px, 1.2vw, 18px);
    letter-spacing: 3px;
    margin-bottom: 16px;
    opacity: 0.95;
  }
  .subtitle-en .bold { font-weight: 700; }
  .subtitle-en .light { font-weight: 300; }

  .title-cn {
    font-size: clamp(28px, 4vw, 64px);
    font-weight: 300;
    letter-spacing: 8px;
    line-height: 1.3;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  /* ---------- 左中引语区 ---------- */
  .quote-area {
    grid-row: 2;
    grid-column: 1;
    align-self: center;
    margin-top: 8%;
  }
  .quote-mark {
    font-family: Georgia, serif;
    font-size: clamp(24px, 2.5vw, 40px);
    line-height: 1;
    margin-bottom: 8px;
    opacity: 0.8;
  }
  .quote-en {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(10px, 0.9vw, 14px);
    letter-spacing: 2px;
    font-weight: 400;
    opacity: 0.7;
    margin-bottom: 8px;
  }
  .quote-cn {
    font-size: clamp(12px, 1.1vw, 16px);
    letter-spacing: 2px;
    opacity: 0.85;
    font-weight: 300;
  }

  /* ---------- 左下角 ---------- */
  .bottom-left {
    grid-row: 3;
    grid-column: 1;
    align-self: end;
  }
  .design-cn {
    font-size: clamp(11px, 1vw, 14px);
    letter-spacing: 2px;
    opacity: 0.8;
    margin-bottom: 4px;
  }
  .design-en {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(9px, 0.8vw, 12px);
    letter-spacing: 1.5px;
    opacity: 0.6;
  }

  /* ---------- 右下角 ---------- */
  .bottom-right {
    grid-row: 3;
    grid-column: 2;
    justify-self: end;
    align-self: end;
    text-align: right;
    position: relative;
  }
  .time-en {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(14px, 1.3vw, 20px);
    letter-spacing: 3px;
    font-weight: 300;
  }
  .time-cn {
    font-size: clamp(10px, 0.9vw, 13px);
    letter-spacing: 2px;
    opacity: 0.7;
    margin: 4px 0 8px;
  }
  .time-date {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(24px, 2.5vw, 36px);
    font-weight: 300;
    letter-spacing: 2px;
    position: relative;
    display: inline-block;
  }
  /* 斜线装饰 */
  .time-date::before {
    content: '';
    position: absolute;
    top: -10px;
    right: -4px;
    width: 1px;
    height: 140%;
    background: rgba(255,255,255,0.4);
    transform: rotate(25deg);
    transform-origin: top;
    pointer-events: none;
  }

  /* ========== 导出按钮 ========== */
  .actions {
    margin-top: 30px;
    display: flex;
    gap: 16px;
  }
  .btn {
    padding: 12px 32px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.8);
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.3s;
    font-family: inherit;
  }
  .btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.4);
    color: #fff;
  }

  /* ========== 响应式 ========== */
  @media (max-width: 768px) {
    .poster { aspect-ratio: 16 / 9; }
    .poster-content { padding: 6% 5%; }
    .title-cn { letter-spacing: 4px; }
    .quote-area { margin-top: 12%; }
  }
</style>
</head>
<body>

  <div class="hint">点击任意文字即可直接编辑，编辑完成后可截图保存</div>

  <div class="poster" id="poster">
    <!-- Layer 1: 背景图 -->
    <div class="poster-bg"></div>

    <!-- Layer 2: 暗色渐变遮罩 -->
    <div class="poster-overlay"></div>

    <!-- Layer 3: 底部环境光 -->
    <div class="poster-vignette"></div>

    <!-- Layer 4 & 5: 文字内容 -->
    <div class="poster-content">
      <!-- 右上：品牌 Logo -->
      <div class="logo-area">
        <div class="logo-icon" contenteditable="true">ROO HOME</div>
        <div class="logo-text" contenteditable="true">ROO HOME</div>
      </div>

      <!-- 左上：主标题 -->
      <div class="main-title-area">
        <div class="subtitle-en" contenteditable="true">
          <span class="bold">SEE THE</span> <span class="light">FUTURE 2023</span>
        </div>
        <div class="title-cn" contenteditable="true">千里智行 &nbsp; 探无止境</div>
      </div>

      <!-- 左中：引语 -->
      <div class="quote-area">
        <div class="quote-mark">"</div>
        <div class="quote-en" contenteditable="true">TECHNOLOGY | MOBILITY | INNOVATION</div>
        <div class="quote-cn" contenteditable="true">为每一种生活，创造舒适的移动空间</div>
      </div>

      <!-- 左下：视觉设计标注 -->
      <div class="bottom-left">
        <div class="design-cn" contenteditable="true">原创视觉设计</div>
        <div class="design-en" contenteditable="true">VISUAL DESIGN</div>
      </div>

      <!-- 右下：时间 -->
      <div class="bottom-right">
        <div class="time-en" contenteditable="true">TIME</div>
        <div class="time-cn" contenteditable="true">时间</div>
        <div class="time-date" contenteditable="true">06.01</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="resetText()">重置文字</button>
    <button class="btn" onclick="alert('请使用浏览器截图功能截取海报区域')">保存为图片</button>
  </div>

<script>
  const originalTexts = {};
  document.querySelectorAll('[contenteditable="true"]').forEach((el, i) => {
    originalTexts[i] = el.innerHTML;
  });
  function resetText() {
    document.querySelectorAll('[contenteditable="true"]').forEach((el, i) => {
      el.innerHTML = originalTexts[i];
    });
  }
  document.querySelectorAll('[contenteditable="true"]').forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
  });
</script>

</body>
</html>
